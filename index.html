<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>OC99TOP · 规则模板与证书仓库</title>
  <meta name="description" content="OC99TOP 官方规则模板、二创声明、授权证书统一存储仓库" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Segoe UI,Arial' font-weight='700' fill='%23fff' text-anchor='middle'%3EOC%3C/text%3E%3C/svg%3E" />

  <!-- docsify 基础主题（作为底层样式，Dosify 会覆盖） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <!-- Dosify 主题 -->
  <link rel="stylesheet" href="assets/css/dosify.css" />
</head>

<body>
  <div id="app">正在加载…</div>
  <noscript>本站点需要启用 JavaScript 才能浏览。</noscript>

  <script>
    window.$docsify = {
      name: 'OC99TOP',
      nameLink: '/',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 0,        // 侧边栏完全由 _sidebar.md 控制，不自动注入页面标题
      maxLevel: 4,
      auto2top: true,
      notFoundPage: true,
      coverpage: false,
      relativePath: false,
      // 所有层级共用根目录侧边栏，避免请求 子目录/_sidebar.md 产生 404
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档…',
        noData: '未找到匹配结果',
        depth: 4,
        hideOtherSidebarContent: false
      },
      // Dosify 侧边栏行为配置
      dosifySidebar: {
        maxLevel: 3,          // 一级 / 二级 / 三级目录可折叠
        defaultOpenLevel: 1,  // 默认展开到第几级
        sticky: true,         // 展开时标题吸附在目录顶部，便于快速收起
        persist: true,        // 展开状态记忆到 localStorage
        rowHeight: 34         // 与 CSS 中 --dosify-row-height 保持一致
      },
      plugins: []
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Dosify 多级折叠侧边栏插件（会自行注册到 $docsify.plugins） -->
  <script src="assets/js/dosify-sidebar.js"></script>
</body>

</html>
